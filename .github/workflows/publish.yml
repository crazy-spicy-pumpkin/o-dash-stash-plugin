# Publishes the plugin as a Stash package source.
#
# ROLE. Turns a push into a one-click install: builds the zip and the index
# that Stash's package manager reads, and serves them from GitHub Pages. The
# resulting index URL is what someone pastes into Settings → Plugins →
# Available Plugins → Add Source.
#
# Nothing here is committed — dist/ stays a build artifact. The site is rebuilt
# from source each time, so the sha256 in the index always matches the zip
# beside it.
#
# Triggered by a tag, not by a push to main. A zip records modification times,
# so rebuilding identical sources still yields a different sha256 — publishing
# on every commit would churn what people install for a change to prose. A tag
# is the point where a release was actually intended.

name: Publish plugin source

on:
  push:
    tags: ['v*']
  workflow_dispatch:      # so a republish never requires a throwaway tag

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A queued run is allowed to finish rather than being
# cancelled, so the live index is never left pointing at a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest
        # The manifest is the source of truth and the tag mirrors it. If they
        # drift, the published index advertises one version while the plugin
        # reports another, and Stash offers an update that installs something
        # it then believes is out of date — a loop with no error message.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged=${GITHUB_REF#refs/tags/v}
          manifest=$(sed -n 's/^version: *//p' o-dashboard.yml | head -1)
          echo "tag:      $tagged"
          echo "manifest: $manifest"
          [ "$tagged" = "$manifest" ] || {
            echo "tag v$tagged does not match manifest $manifest — bump.sh then re-tag"
            exit 1
          }

      - name: Build the package and its index
        run: sh tools/package.sh _site

      - name: Check the index and the zip agree
        # The index carries a sha256 of the zip. If they ever disagree, Stash
        # refuses the install with an integrity error that is hard to read, so
        # catch it here where the message can say what happened.
        run: |
          indexed=$(grep '^  sha256:' _site/index.yml | awk '{print $2}')
          actual=$(sha256sum _site/o-dashboard.zip | cut -d' ' -f1)
          echo "indexed: $indexed"
          echo "actual:  $actual"
          [ "$indexed" = "$actual" ] || { echo "index does not match the zip"; exit 1; }
          unzip -l _site/o-dashboard.zip | grep -q ' o-dashboard.yml$' \
            || { echo "manifest is not at the top level of the zip"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
