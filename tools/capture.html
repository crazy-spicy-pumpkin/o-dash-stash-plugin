<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>capture</title>
<link rel="stylesheet" href="/src/styles.css">
<style>html, body { margin: 0; padding: 0; }</style>
</head>
<body>
<!--
  One frame of the theme GIF.

      tools/capture.html?demo=1&mode=light&palette=spicy-pumpkin

  The theme is set by seeding localStorage *before* app.js initialises, so the
  frame goes through the real theme code path — the button label, the active
  swatch and the palette all agree. Stamping data-theme directly would be
  quicker and would produce a frame that lies about its own UI.

  Always run with demo=1. Captures of a real library must never be produced:
  see CLAUDE.md.
-->
<div class="od-viz-root" id="mount"></div>
<script>
const params = new URLSearchParams(location.search);
if (params.get('demo') !== '1') {
  document.body.textContent = 'refusing to capture without demo=1';
  throw new Error('capture requires demo mode');
}
localStorage.clear();
const mode = params.get('mode') || 'light';
localStorage.setItem('o-dash-mode', mode);
if (params.get('palette')) {
  localStorage.setItem(mode === 'dark' ? 'o-dash-dark' : 'o-dash-light', params.get('palette'));
  // Stamp the palette before anything renders, so applyTheme later sets the
  // same value and nothing transitions.
  //
  // Cards transition background-color and color over 0.25s, and headless
  // Chrome's --virtual-time-budget freezes transitions part-way — the exact
  // same trap that makes getComputedStyle unreliable there. Without this, every
  // frame captures the *previous* palette's card colours part-faded into the
  // new one: dark themes came out with pale cards and unreadable ink. It looks
  // like a palette bug and is not one.
  document.getElementById('mount').setAttribute('data-theme', params.get('palette'));
}
</script>

<script src="/src/demo-source.js"></script>
<script>
fetch('/src/index.html').then((r) => r.text()).then((html) => {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  for (const s of doc.body.querySelectorAll('script')) s.remove();
  document.getElementById('mount').innerHTML = doc.body.innerHTML;
  const s = document.createElement('script');
  s.src = '/src/app.js';
  // ?menu=1 opens the theme switcher in the frame. Without it a GIF that
  // cycles palettes gives no hint of where the control is, and the change
  // reads as happening by itself. The menu also shows which palette is
  // active, so the frame explains itself.
  s.onload = () => {
    if (params.get('menu') === '1') {
      setTimeout(() => document.getElementById('od-theme-btn').click(), 400);
    }
  };
  document.body.appendChild(s);
});
</script>
</body>
</html>
